# ReadTheDocs build configuration for OSTRAM LAC (same build stack as OSTRAM).
# Two RTD projects share this file: the main one (language: en) and its
# Spanish translation (language: es); RTD passes -D language=<code>
# automatically per project.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
